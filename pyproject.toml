[project]
name = "tracework"
version = "0.1.0"
description = "An inspectable, repeatable AI data workspace"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "duckdb>=1.3,<2", "pyarrow>=19,<24", "sqlglot>=26,<31", "python-multipart>=0.0.20", "httpx>=0.28,<1", "pydantic>=2.10,<3"]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
